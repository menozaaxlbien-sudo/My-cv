<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="sysBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="shadowSys" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="#0f172a" rx="12"/>

  <g transform="translate(40, 30)" filter="url(#shadowSys)">
    <rect width="720" height="420" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

    <!-- Title Bar -->
    <rect width="720" height="42" rx="10" fill="#0f172a"/>
    <rect y="32" width="720" height="10" fill="#0f172a"/>
    <circle cx="24" cy="21" r="5" fill="#ef4444"/>
    <circle cx="40" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="21" r="5" fill="#10b981"/>
    <text x="360" y="26" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">
      DNSC IT Lab Diagnostic &amp; Hardware Asset Manager
    </text>

    <!-- Top Metric Stats -->
    <g transform="translate(24, 60)">
      <!-- Metric 1 -->
      <rect width="154" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="600">TOTAL WORKSTATIONS</text>
      <text x="14" y="48" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="800">45 / 45</text>
      <circle cx="132" cy="40" r="4" fill="#10b981"/>

      <!-- Metric 2 -->
      <rect x="172" width="154" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="186" y="24" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="600">NETWORK HEALTH</text>
      <text x="186" y="48" fill="#10b981" font-family="sans-serif" font-size="18" font-weight="800">1 Gbps LAN</text>

      <!-- Metric 3 -->
      <rect x="344" width="154" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="358" y="24" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="600">HARDWARE TICKETS</text>
      <text x="358" y="48" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="800">0 Critical</text>

      <!-- Metric 4 -->
      <rect x="516" width="156" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="530" y="24" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="600">PRINTER / PERIPHERAL</text>
      <text x="530" y="48" fill="#a855f7" font-family="sans-serif" font-size="18" font-weight="800">Shared Online</text>
    </g>

    <!-- Lab Map / Workstation Status Table -->
    <g transform="translate(24, 140)">
      <rect width="672" height="250" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <rect width="672" height="34" rx="8" fill="#1e293b"/>
      <rect y="26" width="672" height="8" fill="#1e293b"/>
      
      <text x="20" y="22" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">NODE ID</text>
      <text x="110" y="22" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">IP ADDRESS</text>
      <text x="240" y="22" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">SPECIFICATION</text>
      <text x="440" y="22" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">STATUS</text>
      <text x="560" y="22" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">LAST AUDITED</text>

      <!-- Row 1 -->
      <line x1="0" y1="70" x2="672" y2="70" stroke="#334155" stroke-width="1"/>
      <text x="20" y="56" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">PC-LAB1-01</text>
      <text x="110" y="56" fill="#cbd5e1" font-family="sans-serif" font-size="11">192.168.10.101</text>
      <text x="240" y="56" fill="#cbd5e1" font-family="sans-serif" font-size="11">Intel i5-10400 / 16GB / 512GB SSD</text>
      <rect x="440" y="44" width="70" height="18" rx="4" fill="#10b981" fill-opacity="0.2"/>
      <text x="475" y="57" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">OPERATIONAL</text>
      <text x="560" y="56" fill="#94a3b8" font-family="sans-serif" font-size="11">Oct 24, 2026</text>

      <!-- Row 2 -->
      <line x1="0" y1="106" x2="672" y2="106" stroke="#334155" stroke-width="1"/>
      <text x="20" y="92" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">PC-LAB1-02</text>
      <text x="110" y="92" fill="#cbd5e1" font-family="sans-serif" font-size="11">192.168.10.102</text>
      <text x="240" y="92" fill="#cbd5e1" font-family="sans-serif" font-size="11">Intel i5-10400 / 16GB / 512GB SSD</text>
      <rect x="440" y="80" width="70" height="18" rx="4" fill="#10b981" fill-opacity="0.2"/>
      <text x="475" y="93" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">OPERATIONAL</text>
      <text x="560" y="92" fill="#94a3b8" font-family="sans-serif" font-size="11">Oct 24, 2026</text>

      <!-- Row 3 -->
      <line x1="0" y1="142" x2="672" y2="142" stroke="#334155" stroke-width="1"/>
      <text x="20" y="128" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">PC-LAB1-03</text>
      <text x="110" y="128" fill="#cbd5e1" font-family="sans-serif" font-size="11">192.168.10.103</text>
      <text x="240" y="128" fill="#cbd5e1" font-family="sans-serif" font-size="11">Intel i5-10400 / 16GB / 512GB SSD</text>
      <rect x="440" y="116" width="70" height="18" rx="4" fill="#3b82f6" fill-opacity="0.2"/>
      <text x="475" y="129" fill="#60a5fa" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">MAINTENANCE</text>
      <text x="560" y="128" fill="#94a3b8" font-family="sans-serif" font-size="11">Oct 22, 2026</text>

      <!-- Row 4 -->
      <line x1="0" y1="178" x2="672" y2="178" stroke="#334155" stroke-width="1"/>
      <text x="20" y="164" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">PRN-HP-01</text>
      <text x="110" y="164" fill="#cbd5e1" font-family="sans-serif" font-size="11">192.168.10.200</text>
      <text x="240" y="164" fill="#cbd5e1" font-family="sans-serif" font-size="11">Network LaserJet Pro / LAN Shared</text>
      <rect x="440" y="152" width="70" height="18" rx="4" fill="#10b981" fill-opacity="0.2"/>
      <text x="475" y="165" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">READY</text>
      <text x="560" y="164" fill="#94a3b8" font-family="sans-serif" font-size="11">Oct 25, 2026</text>

      <!-- Footer Note -->
      <text x="20" y="215" fill="#64748b" font-family="sans-serif" font-size="10">Diagnostic utility built for DNSC Laboratory Systems with automated IP collision checks and ping health checks.</text>
    </g>
  </g>
</svg>
