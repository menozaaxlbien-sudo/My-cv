<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="tourBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadowTour" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="#0f172a" rx="12"/>

  <!-- Main Window -->
  <g transform="translate(40, 30)" filter="url(#shadowTour)">
    <rect width="720" height="420" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

    <!-- Browser Bar -->
    <rect width="720" height="42" rx="10" fill="#0f172a"/>
    <rect y="32" width="720" height="10" fill="#0f172a"/>
    <circle cx="24" cy="21" r="5" fill="#ef4444"/>
    <circle cx="40" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="21" r="5" fill="#10b981"/>

    <!-- URL bar -->
    <rect x="180" y="8" width="360" height="26" rx="13" fill="#1e293b"/>
    <text x="360" y="25" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">https://tourease-davao.app/explore</text>

    <!-- Navigation Header -->
    <rect x="0" y="42" width="720" height="50" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="30" y="73" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="800">🌴 TourEase</text>
    <text x="130" y="73" fill="#64748b" font-family="sans-serif" font-size="11">Discover Mindanao</text>

    <text x="420" y="72" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">Destinations</text>
    <text x="510" y="72" fill="#94a3b8" font-family="sans-serif" font-size="11">Itineraries</text>
    <text x="590" y="72" fill="#94a3b8" font-family="sans-serif" font-size="11">Travel Guides</text>
    <rect x="655" y="55" width="45" height="24" rx="4" fill="#0284c7"/>
    <text x="677" y="71" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Login</text>

    <!-- Hero Banner within App -->
    <g transform="translate(24, 104)">
      <rect width="672" height="110" rx="8" fill="url(#tourBg)"/>
      <text x="24" y="40" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="700">Explore Davao Region's Hidden Gems</text>
      <text x="24" y="62" fill="#bae6fd" font-family="sans-serif" font-size="11">Curated eco-tourism spots, island getaways, and local heritage trails in Southern Mindanao.</text>

      <!-- Search pill -->
      <rect x="24" y="74" width="280" height="26" rx="6" fill="#ffffff"/>
      <text x="36" y="91" fill="#64748b" font-family="sans-serif" font-size="10">🔍 Search island, mountain, resort...</text>
      <rect x="235" y="77" width="65" height="20" rx="4" fill="#0284c7"/>
      <text x="267" y="91" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="600" text-anchor="middle">Explore</text>
    </g>

    <!-- Destination Cards Grid -->
    <!-- Card 1: Samal Island -->
    <g transform="translate(24, 230)">
      <rect width="210" height="170" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <rect width="210" height="90" rx="8" fill="url(#cardGrad1)"/>
      <rect y="80" width="210" height="10" fill="url(#cardGrad1)"/>
      <text x="14" y="55" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Samal Island</text>
      <text x="14" y="72" fill="#e0f2fe" font-family="sans-serif" font-size="10">Beaches &amp; Marine Sanctuary</text>
      <rect x="14" y="102" width="60" height="16" rx="4" fill="#1e293b"/>
      <text x="44" y="114" fill="#38bdf8" font-family="sans-serif" font-size="8" text-anchor="middle">ISLAND TOUR</text>
      <text x="14" y="136" fill="#94a3b8" font-family="sans-serif" font-size="10">White sand coastlines &amp; diving.</text>
      <text x="14" y="156" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">★ 4.9 <tspan fill="#64748b" font-weight="normal">(1,240 reviews)</tspan></text>
    </g>

    <!-- Card 2: Maragusan Highland -->
    <g transform="translate(255, 230)">
      <rect width="210" height="170" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <rect width="210" height="90" rx="8" fill="url(#cardGrad2)"/>
      <rect y="80" width="210" height="10" fill="url(#cardGrad2)"/>
      <text x="14" y="55" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Maragusan Springs</text>
      <text x="14" y="72" fill="#d1fae5" font-family="sans-serif" font-size="10">Cold Springs &amp; Waterfalls</text>
      <rect x="14" y="102" width="60" height="16" rx="4" fill="#1e293b"/>
      <text x="44" y="114" fill="#34d399" font-family="sans-serif" font-size="8" text-anchor="middle">ECO-TRAIL</text>
      <text x="14" y="136" fill="#94a3b8" font-family="sans-serif" font-size="10">Highland mist, rivers &amp; falls.</text>
      <text x="14" y="156" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">★ 4.8 <tspan fill="#64748b" font-weight="normal">(890 reviews)</tspan></text>
    </g>

    <!-- Card 3: Tagum City Night Market -->
    <g transform="translate(486, 230)">
      <rect width="210" height="170" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <rect width="210" height="90" rx="8" fill="#f59e0b"/>
      <rect y="80" width="210" height="10" fill="#f59e0b"/>
      <text x="14" y="55" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Tagum City Hub</text>
      <text x="14" y="72" fill="#fef3c7" font-family="sans-serif" font-size="10">Culinary &amp; Music Capital</text>
      <rect x="14" y="102" width="60" height="16" rx="4" fill="#1e293b"/>
      <text x="44" y="114" fill="#fbbf24" font-family="sans-serif" font-size="8" text-anchor="middle">CULTURE</text>
      <text x="14" y="136" fill="#94a3b8" font-family="sans-serif" font-size="10">Street food culture &amp; parks.</text>
      <text x="14" y="156" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">★ 4.7 <tspan fill="#64748b" font-weight="normal">(640 reviews)</tspan></text>
    </g>
  </g>
</svg>
